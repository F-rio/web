<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI検索&比較</title>
    <!-- 🎨 あなたの作ったかっこいいCSSを読み込みます -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔍 入力欄エリア（CSSのアニメーションに対応） -->
    <div class="text-input">
        <input type="text" id="input1" placeholder="" />
        <label for="input1">enter→</label>
    </div>

    <!-- 💬 AIのメッセージ（検索中... や 通信成功！）が出る場所 -->
    <div id="result-text"></div>
    
    <!-- 📊 AIが作った図（グラフ・チャート）が出る場所 -->
    <div id="result-graph" class="mermaid"></div>

    <!-- 🏃‍♂️ 動きをつけるJavaScript（script.js）を読み込みます -->
    <script src="script.js"></script>

    <!-- 🤖 ネットのブロックを回避して、安全に図を描くためのAI用ライブラリ -->
    <script type="module">
        import mermaid from './mermaid.js';
        mermaid.initialize({ startOnLoad: true });
        window.mermaid = mermaid;
    </script>

</body>
</html>
